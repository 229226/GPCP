[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgracc"
version = "0.1.0"
description = "Architecture-agnostic CGRA compiler skeleton (machine model + scheduler + legality checker + emitter)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
cgracc = "cgracc.cli:main"

[tool.setuptools]
packages = ["cgracc", "cgracc.ir", "cgracc.sched", "cgracc.verify", "cgracc.emit"]
