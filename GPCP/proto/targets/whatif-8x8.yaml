# what-if 目标（**不是**第二个真相，只用于"换厨房测试"）
#
# docs/20 §0 要求：同一份协议场景对两种目标都要能编译，源码一个字不改。
# 这个文件只覆盖几何参数，其余字段沿用 cgra/target.yaml（由 lower.py 合并）。
# 若哪天真做了 8x8 芯片，正式参数应写进 cgra/target.yaml，本文件随之删除。

name: whatif-8x8-w64

array:
  rows: 8
  cols: 8

spad:
  banks: 64
  words_per_bank: 64

imem:
  max_cycles: 512
