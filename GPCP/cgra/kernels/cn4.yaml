name: cn4
kind: dfg
desc: "4 消息 min-sum 校验节点（增量折叠符号位降寄存器压力）：min1/min2/sign；消息在 IN 区，结果写相邻槽位"
leaves:
  m0: {at: {region: "IN", slot: 0, pe_per_bank: 1}}
  m1: {at: {region: "IN", slot: 1, pe_per_bank: 1}}
  m2: {at: {region: "IN", slot: 2, pe_per_bank: 1}}
  m3: {at: {region: "IN", slot: 3, pe_per_bank: 1}}
ops:
  - {name: s0, op: shr, a: m0, imm: 31}
  - {name: a0x, op: xor, a: m0, b: s0}
  - {name: a0, op: sub, a: a0x, b: s0}
  - {name: s1, op: shr, a: m1, imm: 31}
  - {name: a1x, op: xor, a: m1, b: s1}
  - {name: a1, op: sub, a: a1x, b: s1}
  - {name: sg01, op: xor, a: s0, b: s1}
  - {name: s2, op: shr, a: m2, imm: 31}
  - {name: a2x, op: xor, a: m2, b: s2}
  - {name: a2, op: sub, a: a2x, b: s2}
  - {name: sg012, op: xor, a: sg01, b: s2}
  - {name: s3, op: shr, a: m3, imm: 31}
  - {name: a3x, op: xor, a: m3, b: s3}
  - {name: a3, op: sub, a: a3x, b: s3}
  - {name: sign, op: xor, a: sg012, b: s3}
  - {name: lo01, op: min, a: a0, b: a1}
  - {name: hi01, op: max, a: a0, b: a1}
  - {name: lo23, op: min, a: a2, b: a3}
  - {name: hi23, op: max, a: a2, b: a3}
  - {name: min1, op: min, a: lo01, b: lo23}
  - {name: mx, op: max, a: lo01, b: lo23}
  - {name: mn, op: min, a: hi01, b: hi23}
  - {name: min2, op: min, a: mx, b: mn}
sinks:
  min1: {at: {region: "IN", slot: 8, pe_per_bank: 1}}
  min2: {at: {region: "IN", slot: 9, pe_per_bank: 1}}
  sign: {at: {region: "IN", slot: 10, pe_per_bank: 1}}
parallelism: 4
