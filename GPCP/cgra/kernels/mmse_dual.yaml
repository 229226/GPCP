name: mmse_dual
kind: dfg
desc: "2-Rx / 2-layer MMSE 合并 tile：一次运行同时算两层的向量相关
      b_l = conj(h0l)*y1 + conj(h1l)*y2（Q30），16 个 PE 各做 1 个 RE。
      与 mmse_2x1 的区别：(a) 两层合并在同一次运行里，y 只需搬一次；
      (b) 8 个信道系数用广播叶子（每个只占 1 个字），换层不用重写 16 份。
      边界说明：ISA 的 mul 是 16x16->32，32 位 Q30 结果不能再做 mul，故
      2x2 求伴随与符号判决仍归 CVA6 标量侧。数值范围由 contract 字段声明。
      自检：随机复数输入，与黄金模型逐值对账（同有限精度语义）。"
contract:
  q_format: Q15
  leaf_max_abs: 20000
  max_intermediate: int32
  sink_max_abs: 1600000000
leaves:
  # 8 个信道系数：广播，全部 PE 读同一个字（换一个 slot 就换一个系数）
  h00r: {at: {region: "MIN1", slot: 0, broadcast: True}}
  h00i: {at: {region: "MIN1", slot: 1, broadcast: True}}
  h10r: {at: {region: "MIN1", slot: 2, broadcast: True}}
  h10i: {at: {region: "MIN1", slot: 3, broadcast: True}}
  h01r: {at: {region: "MIN1", slot: 4, broadcast: True}}
  h01i: {at: {region: "MIN1", slot: 5, broadcast: True}}
  h11r: {at: {region: "MIN1", slot: 6, broadcast: True}}
  h11i: {at: {region: "MIN1", slot: 7, broadcast: True}}
  # 4 个接收样本：一个 bank 装 16 个 PE 的 16 个位置（pe_per_bank = 32）
  # I/Q 交错：PE k 占 2k / 2k+1 两个字。搬运引擎按 64 位 beat 取数，实虚必须
  # 一起搬（源地址 8 字节对齐），所以用 stride 2 而不是两个独立 bank。
  zero: {at: {region: "MIN1", slot: 8, broadcast: True}}
  y1r: {at: {region: "IN + 0", slot: 0, pe_per_bank: 16}}
  y1i: {at: {region: "IN + 0", slot: 1, pe_per_bank: 16}}
  y2r: {at: {region: "IN + 1", slot: 0, pe_per_bank: 16}}
  y2i: {at: {region: "IN + 1", slot: 1, pe_per_bank: 16}}
ops:
  # ---- 层 0：b0 = conj(h00)*y1 + conj(h10)*y2 ----
  - { name: a0r, op: mul, a: h00r, b: y1r }
  - { name: a0i, op: mul, a: h00i, b: y1i }
  - { name: b0r, op: mul, a: h10r, b: y2r }
  - { name: b0i, op: mul, a: h10i, b: y2i }
  - { name: r0p, op: add, a: a0r, b: a0i }
  - { name: r0q, op: add, a: b0r, b: b0i }
  - { name: n0r, op: add, a: r0p, b: r0q }
  - { name: c0r, op: mul, a: h00r, b: y1i }
  - { name: c0i, op: mul, a: h00i, b: y1r }
  - { name: d0r, op: mul, a: h10r, b: y2i }
  - { name: d0i, op: mul, a: h10i, b: y2r }
  - { name: s0p, op: sub, a: c0r, b: c0i }
  - { name: s0q, op: sub, a: d0r, b: d0i }
  - { name: n0i, op: add, a: s0p, b: s0q }
  # ---- 层 1：b1 = conj(h01)*y1 + conj(h11)*y2（同一批 y，不重新搬） ----
  - { name: a1r, op: mul, a: h01r, b: y1r }
  - { name: a1i, op: mul, a: h01i, b: y1i }
  - { name: b1r, op: mul, a: h11r, b: y2r }
  - { name: b1i, op: mul, a: h11i, b: y2i }
  - { name: r1p, op: add, a: a1r, b: a1i }
  - { name: r1q, op: add, a: b1r, b: b1i }
  - { name: n1r, op: add, a: r1p, b: r1q }
  - { name: c1r, op: mul, a: h01r, b: y1i }
  - { name: c1i, op: mul, a: h01i, b: y1r }
  - { name: d1r, op: mul, a: h11r, b: y2i }
  - { name: d1i, op: mul, a: h11i, b: y2r }
  - { name: s1p, op: sub, a: c1r, b: c1i }
  - { name: s1q, op: sub, a: d1r, b: d1i }
  - { name: n1i, op: add, a: s1p, b: s1q }
  # ---- 数值契约守卫：把 max|y| 也算出来，CPU 只读 1 个字就知道要不要回退 ----
  - { name: g1r, op: sub, a: zero, b: y1r }
  - { name: g1i, op: sub, a: zero, b: y1i }
  - { name: g2r, op: sub, a: zero, b: y2r }
  - { name: g2i, op: sub, a: zero, b: y2i }
  - { name: a1, op: max, a: y1r, b: g1r }
  - { name: a2, op: max, a: y1i, b: g1i }
  - { name: a3, op: max, a: y2r, b: g2r }
  - { name: a4, op: max, a: y2i, b: g2i }
  - { name: a12, op: max, a: a1, b: a2 }
  - { name: a34, op: max, a: a3, b: a4 }
  - { name: ymax, op: max, a: a12, b: a34 }
sinks:
  n0r: {at: {region: "OUT + 0", slot: 0, pe_per_bank: 32}}
  n0i: {at: {region: "OUT + 1", slot: 0, pe_per_bank: 32}}
  n1r: {at: {region: "OUT + 2", slot: 0, pe_per_bank: 32}}
  n1i: {at: {region: "OUT + 3", slot: 0, pe_per_bank: 32}}
  ymax: {at: {region: "OUT + 4", slot: 0, pe_per_bank: 32}}
parallelism: full
