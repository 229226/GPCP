name: cplx_mul
kind: dfg
desc: "单抽头复数乘/LS 估计：hr=(yr*xr+yi*xi)>>15, hi=(yi*xr-yr*xi)>>15；输入 IN 区、结果 OUT 区"
leaves:
  yr: {at: {region: "IN", slot: 0, pe_per_bank: 1}}
  yi: {at: {region: "IN", slot: 1, pe_per_bank: 1}}
  xr: {at: {region: "IN", slot: 2, pe_per_bank: 1}}
  xi: {at: {region: "IN", slot: 3, pe_per_bank: 1}}
ops:
  - {name: rr, op: mul, a: yr, b: xr}
  - {name: ii, op: mul, a: yi, b: xi}
  - {name: rs, op: add, a: rr, b: ii}
  - {name: hr, op: shr, a: rs, imm: 15}
  - {name: ir, op: mul, a: yi, b: xr}
  - {name: ri, op: mul, a: yr, b: xi}
  - {name: is, op: sub, a: ir, b: ri}
  - {name: hi, op: shr, a: is, imm: 15}
sinks:
  hr: {at: {region: "OUT", slot: 0, pe_per_bank: 1}}
  hi: {at: {region: "OUT", slot: 1, pe_per_bank: 1}}
parallelism: full
