# GPCP kernel: LDPC 编码的 acc_info 累加（docs/22 待补项）
#
# 38.212 LDPC 编码的核心内层：acc = XOR over edges of c[col][(i+sh)%zc]。
# 循环移位是「按行选列」的数据重排，由 C 侧按图的 sh 表把参与累加的
# 字先摆进 IN 区（这一步是 docs/21 指出的 gather 开销，不由本 kernel 承担）；
# 本 kernel 只做阵列擅长的部分：一个提升行内 20 条边的定值异或树，
# 16 个 PE 各负责一个 bit 位置，与既有 BN/CN 的「一 PE 一提升行」布局对齐。
#
# 与 tools/ldpc_nr.py / sw/soc/ldpc_enc.inc 的逐位对账由
# tools/check_new_kernels.py 完成。
name: ldpc_enc_acc
kind: dfg
desc: "LDPC 编码 acc_info：一个提升行内 20 条边的循环移位后异或累加，输出该行的奇偶累加字"
leaves:
  e0..e19: {at: {region: "IN", slot: "k", pe_per_bank: 1}}
  zero: {at: {region: "IN", slot: 20, pe_per_bank: 1}}
ops:
  - {name: a0, op: xor, a: zero, b: e0}
  - {name: a1, op: xor, a: a0, b: e1}
  - {name: a2, op: xor, a: a1, b: e2}
  - {name: a3, op: xor, a: a2, b: e3}
  - {name: a4, op: xor, a: a3, b: e4}
  - {name: a5, op: xor, a: a4, b: e5}
  - {name: a6, op: xor, a: a5, b: e6}
  - {name: a7, op: xor, a: a6, b: e7}
  - {name: a8, op: xor, a: a7, b: e8}
  - {name: a9, op: xor, a: a8, b: e9}
  - {name: a10, op: xor, a: a9, b: e10}
  - {name: a11, op: xor, a: a10, b: e11}
  - {name: a12, op: xor, a: a11, b: e12}
  - {name: a13, op: xor, a: a12, b: e13}
  - {name: a14, op: xor, a: a13, b: e14}
  - {name: a15, op: xor, a: a14, b: e15}
  - {name: a16, op: xor, a: a15, b: e16}
  - {name: a17, op: xor, a: a16, b: e17}
  - {name: a18, op: xor, a: a17, b: e18}
  - {name: acc, op: xor, a: a18, b: e19}
sinks:
  acc: {at: {region: "OUT", slot: 0, pe_per_bank: 1}}
parallelism: full
