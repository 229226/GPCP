name: polar_inword_s1
kind: dfg
desc: "Polar 编码字内第 1 级：w ^= (w>>2) & mask（mask 由 bench 预装到常量区，广播）"
leaves:
  w: {at: {region: "IN", slot: 0, pe_per_bank: 32}}
  mask: {at: {region: "IN + 1", slot: 0, broadcast: True}}
ops:
  - {name: t,  op: shr, a: w, imm: 2}
  - {name: t2, op: and, a: t, b: mask}
  - {name: w2, op: xor, a: w, b: t2}
sinks:
  w2: {at: {region: "IN", slot: 0, pe_per_bank: 32}}
parallelism: full
