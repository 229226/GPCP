name: polar_word_d4
kind: dfg
desc: "Polar 编码字间级 d=4：w[i] ^= w[i+4] & m[i]（m 逐实例预装到输入区）"
leaves:
  wa: {at: {region: "IN", slot: 0, pe_per_bank: 32}}
  wb: {at: {region: "IN", slot: 4, pe_per_bank: 32}}
  m: {at: {region: "IN + 2", slot: 0, pe_per_bank: 32}}
ops:
  - {name: t, op: and, a: wb, b: m}
  - {name: x, op: xor, a: wa, b: t}
sinks:
  x: {at: {region: "IN", slot: 0, pe_per_bank: 32}}
parallelism: full
