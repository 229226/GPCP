name: vn3
kind: dfg
desc: "3 消息 min-sum 变量节点：sum=ch+m0+m1；输出 sum、sum-m0、sum-m1 与 sign(sum)；输入 REF 区"
leaves:
  ch: {at: {region: "REF", slot: 0, pe_per_bank: 1}}
  m0: {at: {region: "REF", slot: 1, pe_per_bank: 1}}
  m1: {at: {region: "REF", slot: 2, pe_per_bank: 1}}
ops:
  - {name: s1, op: add, a: ch, b: m0}
  - {name: sum, op: add, a: s1, b: m1}
  - {name: om0, op: sub, a: sum, b: m0}
  - {name: om1, op: sub, a: sum, b: m1}
  - {name: sg, op: shr, a: sum, imm: 31}
  - {name: sum_out, op: mov, a: sum}
sinks:
  sum_out: {at: {region: "REF", slot: 3, pe_per_bank: 1}}
  om0: {at: {region: "REF", slot: 4, pe_per_bank: 1}}
  om1: {at: {region: "REF", slot: 5, pe_per_bank: 1}}
  sg: {at: {region: "REF", slot: 6, pe_per_bank: 1}}
parallelism: 8
