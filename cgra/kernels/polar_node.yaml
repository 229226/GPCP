  - {name: aa, op: sub, a: aa1, b: sa}
  - {name: sb, op: shr, a: b, imm: 31}
  - {name: ab1, op: xor, a: b, b: sb}
  - {name: ab, op: sub, a: ab1, b: sb}
  - {name: m, op: min, a: aa, b: ab}
  - {name: s, op: xor, a: sa, b: sb}
  - {name: f1, op: xor, a: m, b: s}
  - {name: f, op: sub, a: f1, b: s}
  - {name: nb, op: neg, a: beta}
  - {name: ba, op: and, a: a, b: nb}
