name: polar_word_d1
kind: dfg
desc: "Polar 编码字间级 d=1：w[i] ^= w[i+1] & m[i]（m 逐 PE 预装到 flat 64..79：该更新的字全 1，其余 0）"
leaves:
  wa: {addr: {base: 0, stride: 1}}
  wb: {addr: {base: 1, stride: 1}}
  m:  {addr: {base: 64, stride: 1}}
ops:
  - {name: t, op: and, a: wb, b: m}
  - {name: x, op: xor, a: wa, b: t}
sinks:
  x: {addr: {base: 0, stride: 1}}
instances: 16
