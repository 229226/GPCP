name: cplx_mul
kind: dfg
desc: "单抽头复数乘/LS 估计：hr=(yr*xr+yi*xi)>>15, hi=(yi*xr-yr*xi)>>15；叶子 bank=p word 0..3（flat stride=32），汇 bank 16+p word 0/1"
leaves:
  yr: {addr: {base: 0, stride: 32}}
  yi: {addr: {base: 1, stride: 32}}
  xr: {addr: {base: 2, stride: 32}}
  xi: {addr: {base: 3, stride: 32}}
ops:
  - {name: rr, op: mul, a: yr, b: xr}
  - {name: ii, op: mul, a: yi, b: xi}
  - {name: rs, op: add, a: rr, b: ii}
  - {name: hr, op: shr, a: rs, imm: 15}
  - {name: ir, op: mul, a: yi, b: xr}
  - {name: ri, op: mul, a: yr, b: xi}
  - {name: is, op: sub, a: ir, b: ri}
  - {name: hi, op: shr, a: is, imm: 15}
sinks:
  hr: {addr: {base: 512, stride: 32}}
  hi: {addr: {base: 513, stride: 32}}
instances: 16
