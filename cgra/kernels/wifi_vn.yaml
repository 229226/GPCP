# GPCP kernel: 802.11be LDPC 变量节点（docs/22 待补项）
#
# min-sum 变量节点：sum = ch + Σ m_k，输出 sum - m_k（每条边的外信息）与 sign(sum)。
# 与既有 kind: bn 的「24 槽、一次装载多 pass」同构，但这里用显式 DFG 表达，
# 因为 802.11 的边不是 QC 块结构、度数逐行变化（docs/22 §2.3）：
# C 侧按行的实际度数把参与的消息摆进 IN 区，缺省边填 0，
# 阵列一次运行算完一个变量节点的全部外信息。
#
# 度数上限取 24（与 CN 镜像的边上对齐），ch 单独占一个槽。
name: wifi_vn
kind: dfg
desc: "802.11 min-sum 变量节点：sum=ch+24 条消息，输出各边外信息 sum-m_k 与硬判符号"
leaves:
  m0..m23: {at: {region: "IN", slot: "k", pe_per_bank: 1}}
  ch: {at: {region: "IN", slot: 24, pe_per_bank: 1}}
  zero: {at: {region: "IN", slot: 25, pe_per_bank: 1}}
ops:
  - {name: s0, op: add, a: ch, b: m0}
  - {name: s1, op: add, a: s0, b: m1}
  - {name: s2, op: add, a: s1, b: m2}
  - {name: s3, op: add, a: s2, b: m3}
  - {name: s4, op: add, a: s3, b: m4}
  - {name: s5, op: add, a: s4, b: m5}
  - {name: s6, op: add, a: s5, b: m6}
  - {name: s7, op: add, a: s6, b: m7}
  - {name: s8, op: add, a: s7, b: m8}
  - {name: s9, op: add, a: s8, b: m9}
  - {name: s10, op: add, a: s9, b: m10}
  - {name: s11, op: add, a: s10, b: m11}
  - {name: s12, op: add, a: s11, b: m12}
  - {name: s13, op: add, a: s12, b: m13}
  - {name: s14, op: add, a: s13, b: m14}
  - {name: s15, op: add, a: s14, b: m15}
  - {name: s16, op: add, a: s15, b: m16}
  - {name: s17, op: add, a: s16, b: m17}
  - {name: s18, op: add, a: s17, b: m18}
  - {name: s19, op: add, a: s18, b: m19}
  - {name: s20, op: add, a: s19, b: m20}
  - {name: s21, op: add, a: s20, b: m21}
  - {name: s22, op: add, a: s21, b: m22}
  - {name: total, op: add, a: s22, b: m23}
  - {name: o0, op: sub, a: total, b: m0}
  - {name: o1, op: sub, a: total, b: m1}
  - {name: o2, op: sub, a: total, b: m2}
  - {name: o3, op: sub, a: total, b: m3}
  - {name: o4, op: sub, a: total, b: m4}
  - {name: o5, op: sub, a: total, b: m5}
  - {name: o6, op: sub, a: total, b: m6}
  - {name: o7, op: sub, a: total, b: m7}
  - {name: o8, op: sub, a: total, b: m8}
  - {name: o9, op: sub, a: total, b: m9}
  - {name: o10, op: sub, a: total, b: m10}
  - {name: o11, op: sub, a: total, b: m11}
  - {name: o12, op: sub, a: total, b: m12}
  - {name: o13, op: sub, a: total, b: m13}
  - {name: o14, op: sub, a: total, b: m14}
  - {name: o15, op: sub, a: total, b: m15}
  - {name: o16, op: sub, a: total, b: m16}
  - {name: o17, op: sub, a: total, b: m17}
  - {name: o18, op: sub, a: total, b: m18}
  - {name: o19, op: sub, a: total, b: m19}
  - {name: o20, op: sub, a: total, b: m20}
  - {name: o21, op: sub, a: total, b: m21}
  - {name: o22, op: sub, a: total, b: m22}
  - {name: o23, op: sub, a: total, b: m23}
  - {name: sg, op: shr, a: total, imm: 31}
sinks:
  o0..o23: {at: {region: "OUT", slot: "k", pe_per_bank: 1}}
  sg: {at: {region: "OUT", slot: 24, pe_per_bank: 1}}
parallelism: full
