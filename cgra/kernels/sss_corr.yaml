name: sss_corr
kind: dfg
desc: "SSS 复数相关部分和：每实例 8 tap；x 窗口在 IN 区、ref 在 REF 区，结果写 LLR 区"
leaves:
  xr0..xr7: {at: {region: "IN", slot: "2*k", pe_per_bank: 2}}
  xi0..xi7: {at: {region: "IN", slot: "1 + 2*k", pe_per_bank: 2}}
  r0..r7: {at: {region: "REF", slot: "k", pe_per_bank: 1}}
ops:
  - {name: pr0, op: mul, a: xr0, b: r0}
  - {name: ar0, op: mov, a: pr0}
  - {name: pi0, op: mul, a: xi0, b: r0}
  - {name: ai0, op: mov, a: pi0}
  - {name: pr1, op: mul, a: xr1, b: r1}
  - {name: ar1, op: add, a: ar0, b: pr1}
  - {name: pi1, op: mul, a: xi1, b: r1}
  - {name: ai1, op: add, a: ai0, b: pi1}
  - {name: pr2, op: mul, a: xr2, b: r2}
  - {name: ar2, op: add, a: ar1, b: pr2}
  - {name: pi2, op: mul, a: xi2, b: r2}
  - {name: ai2, op: add, a: ai1, b: pi2}
  - {name: pr3, op: mul, a: xr3, b: r3}
  - {name: ar3, op: add, a: ar2, b: pr3}
  - {name: pi3, op: mul, a: xi3, b: r3}
  - {name: ai3, op: add, a: ai2, b: pi3}
  - {name: pr4, op: mul, a: xr4, b: r4}
  - {name: ar4, op: add, a: ar3, b: pr4}
  - {name: pi4, op: mul, a: xi4, b: r4}
  - {name: ai4, op: add, a: ai3, b: pi4}
  - {name: pr5, op: mul, a: xr5, b: r5}
  - {name: ar5, op: add, a: ar4, b: pr5}
  - {name: pi5, op: mul, a: xi5, b: r5}
  - {name: ai5, op: add, a: ai4, b: pi5}
  - {name: pr6, op: mul, a: xr6, b: r6}
  - {name: ar6, op: add, a: ar5, b: pr6}
  - {name: pi6, op: mul, a: xi6, b: r6}
  - {name: ai6, op: add, a: ai5, b: pi6}
  - {name: pr7, op: mul, a: xr7, b: r7}
  - {name: part_r, op: add, a: ar6, b: pr7}
  - {name: pi7, op: mul, a: xi7, b: r7}
  - {name: part_i, op: add, a: ai6, b: pi7}
sinks:
  part_r: {at: {region: "LLR", slot: 0, pe_per_bank: 16}}
  part_i: {at: {region: "LLR", slot: 1, pe_per_bank: 16}}
parallelism: full
