name: matmul
kind: dfg
desc: "4x4 整数矩阵乘：每 PE 一个输出 C[row][col] = sum_k A[row][k]*B[k][col]；A 在 flat k+8*pe、B 在 4+k+8*pe，汇 flat 256+pe"
leaves:
  a0: {addr: {base: 0, stride: 8}}
  a1: {addr: {base: 1, stride: 8}}
  a2: {addr: {base: 2, stride: 8}}
  a3: {addr: {base: 3, stride: 8}}
  b0: {addr: {base: 4, stride: 8}}
  b1: {addr: {base: 5, stride: 8}}
  b2: {addr: {base: 6, stride: 8}}
  b3: {addr: {base: 7, stride: 8}}
ops:
  - {name: p0, op: mul, a: a0, b: b0}
  - {name: p1, op: mul, a: a1, b: b1}
  - {name: p2, op: mul, a: a2, b: b2}
  - {name: p3, op: mul, a: a3, b: b3}
  - {name: s01, op: add, a: p0, b: p1}
  - {name: s23, op: add, a: p2, b: p3}
  - {name: sum, op: add, a: s01, b: s23}
sinks:
  sum: {addr: {base: 256, stride: 1}}
instances: 16
