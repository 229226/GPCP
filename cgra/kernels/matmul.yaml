name: matmul
kind: dfg
desc: "4x4 整数矩阵乘：每实例一个输出 C[row][col] = sum_k A[row][k]*B[k][col]；A/B 在 IN 区，结果写输出区"
leaves:
  a0: {at: {region: "IN", slot: 0, pe_per_bank: 4}}
  a1: {at: {region: "IN", slot: 1, pe_per_bank: 4}}
  a2: {at: {region: "IN", slot: 2, pe_per_bank: 4}}
  a3: {at: {region: "IN", slot: 3, pe_per_bank: 4}}
  b0: {at: {region: "IN", slot: 4, pe_per_bank: 4}}
  b1: {at: {region: "IN", slot: 5, pe_per_bank: 4}}
  b2: {at: {region: "IN", slot: 6, pe_per_bank: 4}}
  b3: {at: {region: "IN", slot: 7, pe_per_bank: 4}}
ops:
  - {name: p0, op: mul, a: a0, b: b0}
  - {name: p1, op: mul, a: a1, b: b1}
  - {name: p2, op: mul, a: a2, b: b2}
  - {name: p3, op: mul, a: a3, b: b3}
  - {name: s01, op: add, a: p0, b: p1}
  - {name: s23, op: add, a: p2, b: p3}
  - {name: sum, op: add, a: s01, b: s23}
sinks:
  sum: {at: {region: "REF", slot: 0, pe_per_bank: 32}}
parallelism: full
