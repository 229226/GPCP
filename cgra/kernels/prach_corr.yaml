name: prach_corr
kind: dfg
desc: "PRACH ZC 相关部分和：每实例 8 tap，y/ref 按 IN / REF 命名区域装载；汇 part_r/part_i 由 CVA6 归约"
leaves:
  xr0..xr7: {at: {region: "IN", slot: "2*k", pe_per_bank: 2}}
  xi0..xi7: {at: {region: "IN", slot: "1 + 2*k", pe_per_bank: 2}}
  r0..r7: {at: {region: "REF", slot: "2*k", pe_per_bank: 2}}
  ri0..ri7: {at: {region: "REF", slot: "1 + 2*k", pe_per_bank: 2}}
ops:
  - {name: pr0, op: mul, a: xr0, b: r0}
  - {name: pi0, op: mul, a: xi0, b: ri0}
  - {name: accr0, op: add, a: pr0, b: pi0}
  - {name: pr1, op: mul, a: xr1, b: r1}
  - {name: pi1, op: mul, a: xi1, b: ri1}
  - {name: t1, op: add, a: pr1, b: pi1}
  - {name: accr1, op: add, a: accr0, b: t1}
  - {name: pr2, op: mul, a: xr2, b: r2}
  - {name: pi2, op: mul, a: xi2, b: ri2}
  - {name: t2, op: add, a: pr2, b: pi2}
  - {name: accr2, op: add, a: accr1, b: t2}
  - {name: pr3, op: mul, a: xr3, b: r3}
  - {name: pi3, op: mul, a: xi3, b: ri3}
  - {name: t3, op: add, a: pr3, b: pi3}
  - {name: accr3, op: add, a: accr2, b: t3}
  - {name: pr4, op: mul, a: xr4, b: r4}
  - {name: pi4, op: mul, a: xi4, b: ri4}
  - {name: t4, op: add, a: pr4, b: pi4}
  - {name: accr4, op: add, a: accr3, b: t4}
  - {name: pr5, op: mul, a: xr5, b: r5}
  - {name: pi5, op: mul, a: xi5, b: ri5}
  - {name: t5, op: add, a: pr5, b: pi5}
  - {name: accr5, op: add, a: accr4, b: t5}
  - {name: pr6, op: mul, a: xr6, b: r6}
  - {name: pi6, op: mul, a: xi6, b: ri6}
  - {name: t6, op: add, a: pr6, b: pi6}
  - {name: accr6, op: add, a: accr5, b: t6}
  - {name: pr7, op: mul, a: xr7, b: r7}
  - {name: pi7, op: mul, a: xi7, b: ri7}
  - {name: t7, op: add, a: pr7, b: pi7}
  - {name: part_r, op: add, a: accr6, b: t7}
  - {name: qr0, op: mul, a: xi0, b: r0}
  - {name: qi0, op: mul, a: xr0, b: ri0}
  - {name: d0, op: sub, a: qr0, b: qi0}
  - {name: acci0, op: mov, a: d0}
  - {name: qr1, op: mul, a: xi1, b: r1}
  - {name: qi1, op: mul, a: xr1, b: ri1}
  - {name: d1, op: sub, a: qr1, b: qi1}
  - {name: acci1, op: add, a: acci0, b: d1}
  - {name: qr2, op: mul, a: xi2, b: r2}
  - {name: qi2, op: mul, a: xr2, b: ri2}
  - {name: d2, op: sub, a: qr2, b: qi2}
  - {name: acci2, op: add, a: acci1, b: d2}
  - {name: qr3, op: mul, a: xi3, b: r3}
  - {name: qi3, op: mul, a: xr3, b: ri3}
  - {name: d3, op: sub, a: qr3, b: qi3}
  - {name: acci3, op: add, a: acci2, b: d3}
  - {name: qr4, op: mul, a: xi4, b: r4}
  - {name: qi4, op: mul, a: xr4, b: ri4}
  - {name: d4, op: sub, a: qr4, b: qi4}
  - {name: acci4, op: add, a: acci3, b: d4}
  - {name: qr5, op: mul, a: xi5, b: r5}
  - {name: qi5, op: mul, a: xr5, b: ri5}
  - {name: d5, op: sub, a: qr5, b: qi5}
  - {name: acci5, op: add, a: acci4, b: d5}
  - {name: qr6, op: mul, a: xi6, b: r6}
  - {name: qi6, op: mul, a: xr6, b: ri6}
  - {name: d6, op: sub, a: qr6, b: qi6}
  - {name: acci6, op: add, a: acci5, b: d6}
  - {name: qr7, op: mul, a: xi7, b: r7}
  - {name: qi7, op: mul, a: xr7, b: ri7}
  - {name: d7, op: sub, a: qr7, b: qi7}
  - {name: part_i, op: add, a: acci6, b: d7}
sinks:
  part_r: {at: {region: "OUT", slot: 0, pe_per_bank: 16}}
  part_i: {at: {region: "OUT", slot: 1, pe_per_bank: 16}}
parallelism: full
